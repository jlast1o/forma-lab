function syncScanDraft(){const z=scanState.values;for(const k of ['name','category','grams','meal','kcal','protein','fat','carbs']){const el=$('#scan-'+k);if(el)z[k]=el.value}const cb=$('#scan-catalog');if(cb)scanState.saveCatalog=cb.checked}
function updateScanPreview(){let z=scanState.values,g=Number(z.grams),k=Number(z.kcal);let valid=x=>x!==''&&x!==null&&Number.isFinite(Number(x))&&Number(x)>=0;let kEl=$('#scan-total-kcal'),macroEl=$('#scan-total-macros');if(!kEl||!macroEl)return;if(!Number.isFinite(g)||g<=0||!valid(z.kcal)){kEl.textContent='— ккал';macroEl.textContent='Заполни массу и КБЖУ на 100 г';return}kEl.textContent=fmt(k*g/100)+' ккал';macroEl.textContent=['protein','fat','carbs'].map((x,i)=>['Б','Ж','У'][i]+' '+(valid(z[x])?fmt(Number(z[x])*g/100,1):'—')+' г').join(' · ')}
function cleanNum(v){return Number(String(v).replace(/\s/g,'').replace(',','.'))}
function parseNutritionText(text){
 let src=String(text||'').replace(/[\u00a0\u202f]/g,' ').replace(/[‐‑–—]/g,'-').replace(/[|]/g,' ').replace(/\r/g,'');
 const lines=src.split(/\n+/).map(x=>x.trim()).filter(Boolean),flat=lines.join('   ');
 const number='(\\d{1,4}(?:[\\.,]\\d{1,2})?)';
 const get=(re)=>{for(const line of lines){let m=line.match(re);if(m){let z=cleanNum(m[1]);if(Number.isFinite(z))return z}}let m=flat.match(re);return m?cleanNum(m[1]):null};
 const macro=(stems)=>get(new RegExp('(?:'+stems+')[^\\d\\n]{0,45}'+number+'\\s*(?:г|g)?(?=\\s|$|[,;]|\\.)','i'));
 let protein=macro('белк(?:и|ов|а)?|protein(?:s)?'),fat=macro('жир(?:ы|ов|а)?|fat(?:s)?'),carbs=macro('углевод(?:ы|ов|а)?|carbohydrate(?:s)?|carbs?');
 let kcal=get(new RegExp(number+'\\s*(?:ккал|kcal)(?=\\s|$|[,;])','i'));
 if(kcal==null)kcal=get(new RegExp('(?:ккал|kcal)\\s*[:\\-]?\\s*'+number,'i'));
 const found=[kcal,protein,fat,carbs].filter(x=>x!=null).length;
 const valid=x=>x!=null&&Number.isFinite(x)&&x>=0;
 if(!valid(kcal)||kcal>1000)kcal=null;
 for(const k of ['protein','fat','carbs']){let v={protein,fat,carbs}[k];if(!valid(v)||v>100){if(k==='protein')protein=null;if(k==='fat')fat=null;if(k==='carbs')carbs=null}}
 let derived=false;
 if(kcal==null&&[protein,fat,carbs].every(valid)){kcal=round(protein*4+fat*9+carbs*4,1);derived=true}
 return {kcal,protein,fat,carbs,found,derived};
}
let ocrLibraryPromise=null;
function loadOcrLibrary(){if(window.Tesseract?.createWorker)return Promise.resolve();if(ocrLibraryPromise)return ocrLibraryPromise;ocrLibraryPromise=new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.async=true;s.onload=()=>window.Tesseract?.createWorker?resolve():reject(Error('OCR-движок не запустился'));s.onerror=()=>reject(Error('Не удалось загрузить OCR. Проверь подключение к интернету.'));document.head.appendChild(s)}).catch(e=>{ocrLibraryPromise=null;throw e});return ocrLibraryPromise}
function updateOcrStatus(){let el=$('#scan-status');if(el){el.textContent=scanState.status;el.className='scan-status'+(scanState.error?' error':scanState.finished?' ok':'')}let bar=$('#scan-progress-bar');if(bar)bar.style.width=scanState.progress+'%'}
async function runOCR(file){if(!file)return;const token=++scanState.token;scanState.running=true;scanState.finished=false;scanState.error=false;scanState.status='Загружаем распознавание…';scanState.progress=4;updateOcrStatus();let worker;
 try{await loadOcrLibrary();if(token!==scanState.token)return;
  worker=await window.Tesseract.createWorker('rus+eng',1,{logger:m=>{if(token!==scanState.token)return;if(m.status==='recognizing text'){scanState.progress=Math.max(6,Math.min(98,Math.round((m.progress||0)*100)));scanState.status='Читаем этикетку… '+scanState.progress+'%';updateOcrStatus()}}});
  const result=await worker.recognize(file);if(token!==scanState.token)return;
  scanState.text=result?.data?.text||'';const r=parseNutritionText(scanState.text);
  for(const k of ['kcal','protein','fat','carbs'])if((scanState.values[k]===''||scanState.values[k]==null)&&r[k]!=null)scanState.values[k]=r[k];
  const count=['kcal','protein','fat','carbs'].filter(k=>r[k]!=null).length;
  scanState.status=count?`Найдено ${count} из 4 показателей${r.derived?' (калории рассчитаны по БЖУ)':''}. Проверь всё по упаковке.${!/100\s*(?:г|g)(?![a-z])/i.test(scanState.text)?' Убедись, что значения именно на 100 г.':''}`:'Не удалось уверенно найти таблицу. Попробуй чёткий снимок или внеси цифры вручную.';
  scanState.finished=count>0;scanState.error=count===0;
 }catch(e){if(token!==scanState.token)return;scanState.status='Распознавание недоступно: '+(e.message||'ошибка')+'. Заполни значения вручную.';scanState.error=true}
 finally{if(worker)try{await worker.terminate()}catch(e){}if(token===scanState.token){scanState.running=false;scanState.progress=100;if(ui.modal==='scan-label'){drawModal();updateScanPreview()}}}
}
function handleScanPhoto(file){if(!file)return;if(!file.type.startsWith('image/')){toast('Выбери изображение этикетки');return}if(file.size>12*1024*1024){toast('Фото слишком большое (макс. 12 МБ)');return}syncScanDraft();scanState.token++;if(scanState.url)URL.revokeObjectURL(scanState.url);scanState.file=file;scanState.url=URL.createObjectURL(file);scanState.status='Подготавливаем изображение…';scanState.text='';scanState.error=false;scanState.finished=false;drawModal();updateScanPreview();runOCR(file)}

function foodResults(){let q=ui.foodQuery.trim().toLocaleLowerCase('ru-RU').replace(/ё/g,'е');let fs=foods().filter(x=>x.name.toLocaleLowerCase('ru-RU').replace(/ё/g,'е').includes(q)).slice(0,50);return `<div class="food-results">${fs.length?fs.map(x=>`<button class="food-result" data-act="choose-food" data-id="${esc(x.id)}"><span><b>${esc(x.name)}</b><small>${esc(x.category)} · Б ${fmt(x.protein,1)} · Ж ${fmt(x.fat,1)} · У ${fmt(x.carbs,1)}</small></span><span class="chip">${fmt(x.kcal)} ккал</span></button>`).join(''):empty('Не найдено','Попробуй другое название или добавь свой продукт.')}</div>`}
function exResults(){let q=ui.exQuery.trim().toLocaleLowerCase('ru-RU').replace(/ё/g,'е');let arr=exercises().filter(x=>x.group!=='Кардио').filter(x=>(x.name+' '+x.group+' '+x.equipment).toLocaleLowerCase('ru-RU').replace(/ё/g,'е').includes(q)).slice(0,45);return arr.length?arr.map(x=>`<button class="food-result" data-act="choose-ex" data-id="${esc(x.id)}"><span><b>${esc(x.name)}</b><small>${esc(x.group)} · ${esc(x.equipment)}</small></span><span>＋</span></button>`).join(''):empty('Не нашлось','Тренажёр можно добавить вручную. Ходьбу и кардио записывай отдельно в «Активности» — там минуты и километры, а не подходы.')}
function settingsHtml(){let p=db.profile;const tabs=[['profile','Профиль'],['targets','Цели и БЖУ'],['catalog','Мои продукты и упражнения'],['data','Данные']];let body='';
 if(ui.settingsTab==='profile')body=`<form id="settings-profile"><div class="formgrid">${pForm('pf-name','Имя',p.name,'text','maxlength="48"')}${pForm('pf-age','Возраст',p.age,'number','required min="14" max="100"')}${pForm('pf-height','Рост, см',p.height,'number','required min="100" max="250"')}${pForm('pf-weight','Текущий ориентир веса, кг',p.weight,'number','required min="30" max="400" step="0.1"')}${choose('pf-sex','Пол для оценки калорий',[['','Не указывать'],['male','Мужской'],['female','Женский']],p.sex)}${choose('pf-goal','Цель',[['recomp','Рекомпозиция'],['lose','Снижение веса'],['gain','Рост мышц'],['maintain','Поддержание']],p.goal)}${choose('pf-exp','Подготовка',[['beginner','Начинаю'],['returning','Возвращаюсь'],['experienced','Есть опыт']],p.experience)}${choose('pf-activity','Повседневная активность',[['low','Низкая'],['mid','Умеренная'],['high','Высокая']],p.activity)}${choose('pf-frequency','Тренировок в неделю',[[2,'2'],[3,'3'],[4,'4'],[5,'5']],p.frequency)}</div><div class="formactions"><button class="btn dark" type="submit">Сохранить профиль</button></div></form>`;
 if(ui.settingsTab==='targets')body=`<p class="micro">Цифры — ориентиры, не медицинские рекомендации. Корректируй их по фактическому прогрессу и самочувствию.</p><form id="settings-targets"><div class="formgrid">${pForm('tar-cal','Ккал / день',p.calories,'number','required min="500" max="10000"')}${pForm('tar-protein','Белок, г',p.protein,'number','required min="0" max="800"')}${pForm('tar-fat','Жиры, г',p.fat,'number','required min="0" max="500"')}${pForm('tar-carbs','Углеводы, г',p.carbs,'number','required min="0" max="1500"')}${pForm('tar-water','Вода, мл',p.water,'number','required min="100" max="10000"')}</div><div class="formactions">${btn('Рассчитать заново','recalc-goals','ghost')}<button type="submit" class="btn dark">Сохранить цели</button></div></form>`;

 if(ui.settingsTab==='data')body=`<div class="small-note">Хранилище: localStorage. Если очистишь данные браузера или сменишь устройство, записи не перенесутся сами. Регулярно выгружай резервную копию.</div><div class="quickrow" style="margin:17px 0">${btn('↓ Экспорт в JSON','export','dark')}${btn('↑ Импорт JSON','import','light')}${btn('Удалить все данные','reset','danger')}</div><p class="micro">Экспорт включает профиль, продукты, планы и записи. Импорт заменяет текущие данные после подтверждения.</p>`;
 return `<div class="settings-tabs">${tabs.map(([v,t])=>`<button data-act="settings-tab" data-tab="${v}" class="${ui.settingsTab===v?'active':''}">${t}</button>`).join('')}</div>${body}`;
}
function startDraft(d){if(ui.draft&&!confirm('Начать новую тренировку вместо незавершённой?'))return;ui.draft=d;ui.draftOpen=true;ui.builder=null;persistDraft();closeModal();ui.page='train';render();window.scrollTo({top:0,behavior:'smooth'})}
function deleteItem(kind,id){if(!db.logs[kind]||!confirm('Удалить запись?'))return;db.logs[kind]=db.logs[kind].filter(x=>x.id!==id);save();render();toast('Запись удалена')}
function act(ev){let el=ev.target.closest('[data-page],[data-act]');if(!el)return;
 if(el.dataset.page){nav(el.dataset.page);return}let a=el.dataset.act,id=el.dataset.id,idx=n(el.dataset.index);
 switch(a){
 case 'close-modal':closeModal();break;
 case 'open-quick':openModal('quick');break;
 case 'open-label-scan':resetScanState();openModal('scan-label');break;
 case 'scan-retry':if(scanState.file&&!scanState.running)runOCR(scanState.file);break;
 case 'open-food':ui.foodSelected=null;ui.foodQuery='';openModal('food');break;
 case 'back-food':ui.foodSelected=null;openModal('food');break;
 case 'choose-food':ui.foodSelected=id;openModal('food-portion');break;
 case 'set-grams':$('#food-grams').value=el.dataset.grams;updateFoodPreview();break;
 case 'open-custom-food':ui.foodReturnToSettings=ui.modal==='settings';openModal('custom-food');break;
 case 'open-custom-ex':if(ui.modal==='settings')ui.exPickType='catalog';openModal('custom-ex');break;
 case 'open-cardio':openModal('cardio');break;
 case 'open-sleep':openModal('sleep');break;
 case 'open-well':openModal('well');break;
 case 'open-measure':openModal('measure');break;
 case 'open-water':openModal('water');break;
 case 'water-size':$('#wa-ml').value=el.dataset.size;break;
 case 'water-250':db.logs.water.push({id:uid(),date:ui.date,ml:250});save();render();toast('Добавлено 250 мл воды');break;
 case 'set-date':ui.date=el.dataset.date;render();break;
 case 'start-free':startDraft(makeDraft());break;
 case 'start-session':{let s=activePlan()?.sessions.find(x=>x.id===id);if(s)startDraft(makeDraft(s));break}
 case 'repeat-workout':{let old=db.logs.workouts.find(x=>x.id===id);if(!old)return;let newdraft={id:uid(),date:ui.date,planId:old.planId||null,name:old.name,duration:old.duration,notes:'',exercises:old.exercises.map(e=>({exerciseId:e.exerciseId,name:e.name,sets:e.sets.map(s=>({kg:s.kg,reps:s.reps,done:false}))}))};startDraft(newdraft);break}
 case 'exit-draft':collectDraft();ui.draftOpen=false;render();toast('Черновик сохранён. Продолжить можно на вкладке «Тренировки».');break;
 case 'resume-draft':ui.draftOpen=true;render();break;
 case 'toggle-set':{collectDraft();let s=ui.draft?.exercises[n(el.dataset.ex)]?.sets[n(el.dataset.set)];if(s){if(!s.done){let e=ui.draft?.exercises[n(el.dataset.ex)],ref=exById(e?.exerciseId),bodyWeight=ref?.equipment==='Вес тела';if(s.kg===''&&bodyWeight)s.kg='0';if(s.kg===''||!Number.isFinite(Number(s.kg))||n(s.kg)<0||!Number.isInteger(n(s.reps))||n(s.reps)<1){toast('Проверь вес и повторы. Для упражнений без отягощения можно указать 0 кг.');break}}s.done=!s.done;persistDraft();render()}break}
 case 'copy-previous':{collectDraft();let e=ui.draft?.exercises[idx];let old=e&&lastExerciseData(e.exerciseId,e.name);if(!old){toast('Предыдущие подходы не найдены');break}let filled=0;old.sets.slice(0,12).forEach((set,j)=>{if(!e.sets[j])e.sets.push({kg:'',reps:'',done:false});let dest=e.sets[j];for(let k of ['kg','reps'])if(dest[k]===''||dest[k]==null){dest[k]=set[k];filled++}});persistDraft();render();toast(filled?'Прошлые веса и повторения подставлены. Проверь их перед подходом.':'Поля уже заполнены');break}
 case 'add-set':{collectDraft();let e=ui.draft?.exercises[idx];if(!e)return;if(e.sets.length>=12){toast('Не больше 12 подходов на упражнение');break}let prev=e.sets.at(-1);e.sets.push({reps:prev?.reps||'',kg:prev?.kg||'',done:false});persistDraft();render();break}
 case 'remove-set':{collectDraft();let e=ui.draft?.exercises[idx];if(e?.sets?.length>1)e.sets.pop();persistDraft();render();break}
 case 'remove-work-ex':{if(!confirm('Убрать упражнение из текущей тренировки?'))break;collectDraft();ui.draft.exercises.splice(idx,1);persistDraft();render();break}
 case 'open-ex-picker':collectDraft();ui.exPickType='workout';ui.exQuery='';openModal('pick-ex');break;
 case 'choose-ex':{let e=exById(id);if(!e)return;if(ui.exPickType==='builder'){let s=ui.builder?.sessions[ui.pickSessionIndex];if(s)s.exercises.push(makeTemplate(e.name));}else if(ui.draft){ui.draft.exercises.push({exerciseId:e.id,name:e.name,sets:[{kg:'',reps:'',done:false}]});persistDraft();}if(ui.exPickType==='catalog'){ui.settingsTab='catalog';openModal('settings')}else{closeModal();render()}toast('Упражнение добавлено');break}
 case 'open-generator':openModal('generator');break;
 case 'new-plan':ui.builder={id:uid(),name:'Моя программа',frequency:n(db.profile.frequency,3),created:today(),sessions:[{id:uid(),name:'День A',exercises:[]}]};ui.draftOpen=false;ui.page='train';closeModal();render();break;
 case 'edit-plan':{let p=activePlan();if(!p)return;ui.builder=JSON.parse(JSON.stringify(p));ui.page='train';render();break}
 case 'builder-exit':if(ui.builder&&!confirm('Закрыть конструктор без сохранения изменений?'))break;ui.builder=null;render();break;
 case 'builder-add-session':syncBuilder();if(ui.builder.sessions.length>=7){toast('Максимум 7 разных тренировочных дней');break}ui.builder.sessions.push({id:uid(),name:`День ${ui.builder.sessions.length+1}`,exercises:[]});render();break;
 case 'builder-remove-session':syncBuilder();if(ui.builder.sessions.length<=1){toast('Оставь хотя бы один тренировочный день');break}ui.builder.sessions.splice(idx,1);render();break;
 case 'builder-remove-ex':syncBuilder();ui.builder.sessions[n(el.dataset.si)]?.exercises.splice(n(el.dataset.ei),1);render();break;
 case 'pick-for-builder':syncBuilder();ui.exPickType='builder';ui.pickSessionIndex=n(el.dataset.si);ui.exQuery='';openModal('pick-ex');break;
 case 'builder-save':{syncBuilder();let p=ui.builder;if(!p?.name.trim()||p.sessions.some(x=>!x.name.trim())||p.sessions.every(x=>!x.exercises.length)){toast('Укажи название плана и добавь хотя бы одно упражнение');break}for(let s of p.sessions)for(let e of s.exercises){e.sets=clamp(n(e.sets,3),1,10);e.reps=String(e.reps||'10–12').slice(0,30)}let i=db.plans.findIndex(x=>x.id===p.id);if(i>=0)db.plans[i]=p;else db.plans.push(p);db.activePlanId=p.id;db.profile.frequency=p.frequency;ui.builder=null;save();render();toast('План сохранён');break}
 case 'delete':deleteItem(el.dataset.kind,id);break;
 case 'set-chart':ui.chart=el.dataset.chart;render();break;
 case 'set-range':ui.range=n(el.dataset.range,30);render();break;
 case 'settings':ui.settingsTab='profile';openModal('settings');break;
 case 'settings-tab':ui.settingsTab=el.dataset.tab;drawModal();break;
 case 'recalc-goals':{if(!confirm('Заменить цели калорий и БЖУ новым примерным расчётом?'))break;Object.assign(db.profile,calculatedGoals(db.profile));save();drawModal();toast('Ориентиры пересчитаны');break}
 case 'delete-custom':{if(!confirm('Удалить из каталога? Уже записанные данные останутся.'))break;if(el.dataset.kind==='food')db.customFoods=db.customFoods.filter(x=>x.id!==id);else db.customExercises=db.customExercises.filter(x=>x.id!==id);save();drawModal();break}
 case 'export':exportData();break;
 case 'import':$('#import-json').click();break;
 case 'reset':if(confirm('Удалить ВСЕ записи, планы и профиль?')&&confirm('Точно? Это нельзя отменить без резервной копии.')){db=initial();ui.draft=null;ui.builder=null;try{localStorage.removeItem('formlab.draft.v2')}catch(e){}save();closeModal();ui.page='today';ui.onboardStep=1;ui.onboardData={};render()}break;
 case 'migrate':if(confirm('Перенести профиль и записи из предыдущей версии FORM / LAB?')){if(migrateOld()){ui.page='today';closeModal();render();toast('Предыдущие записи перенесены. Профиль можно изменить.')}else toast('Не удалось найти корректные записи')}break;
 case 'onboard-back':ui.onboardStep=1;render();break;
 }
}
function updateFoodPreview(){let f=foodById(ui.foodSelected),g=n($('#food-grams')?.value),out=$('#food-preview');if(!f||!out)return;out.textContent=`${fmt(f.kcal*g/100)} ккал · Б ${fmt(f.protein*g/100,1)} · Ж ${fmt(f.fat*g/100,1)} · У ${fmt(f.carbs*g/100,1)}`}
function inputs(e){let x=e.target;if(x.id==='date'&&x.value){ui.date=x.value;render();return}if(x.id==='food-search'){ui.foodQuery=x.value;$('#food-search-results').innerHTML=foodResults();return}if(x.id==='ex-search'){ui.exQuery=x.value;$('#ex-results').innerHTML=exResults();return}if(x.id==='strength-ex'){ui.strengthName=x.value;render();return}if(x.id==='food-grams'){updateFoodPreview();return}if(x.id.startsWith('scan-')&&x.closest('#scan-form')){syncScanDraft();updateScanPreview();return}if(x.closest('#workout-form')){collectDraft()}}
function formSubmit(e){let f=e.target;if(!f?.id)return;e.preventDefault();const v=id=>$('#'+id)?.value??'';
 switch(f.id){
 case 'onboard-one':{ui.onboardData={name:v('ob-name').trim(),age:n(v('ob-age')),height:n(v('ob-height')),weight:n(v('ob-weight')),sex:v('ob-sex')};if(!ui.onboardData.age||!ui.onboardData.height||!ui.onboardData.weight)return;ui.onboardStep=2;render();break}
 case 'onboard-two':{let d=ui.onboardData;d.goal=$('input[name="ob-goal"]:checked')?.value||'recomp';d.experience=$('input[name="ob-exp"]:checked')?.value||'beginner';d.activity=v('ob-activity');d.frequency=n(v('ob-frequency'),3);d.startDate=today();db.profile={...db.profile,...d,...calculatedGoals(d)};db.setupComplete=true;db.logs.measures.push({id:uid(),date:today(),weight:round(d.weight,1),waist:'',chest:'',hips:'',arm:'',thigh:'',neck:''});save();render();toast('Готово! Начни с того, что важно сегодня.');break}
 case 'workout-form':{collectDraft();let w=ui.draft;if(!w)return;let ex=w.exercises.map(x=>({...x,sets:x.sets.filter(s=>s.done).map(s=>({kg:round(n(s.kg),2),reps:n(s.reps),rpe:null}))})).filter(x=>x.sets.length);if(!ex.length){toast('Отметь галочкой хотя бы один выполненный подход');return}if(!w.name.trim()||w.duration<1){toast('Добавь название и продолжительность тренировки');return}if(ex.some(x=>x.sets.some(s=>s.reps<=0||s.kg<0))){toast('Проверь вес и повторы отмеченных подходов');return}db.logs.workouts.push({id:uid(),date:w.date,name:w.name.trim(),duration:w.duration,notes:w.notes,planId:w.planId,exercises:ex});ui.date=w.date;ui.draft=null;try{localStorage.removeItem('formlab.draft.v2')}catch(e){}save();render();window.scrollTo({top:0,behavior:'smooth'});toast('Тренировка сохранена — отличный шаг!');break}
 case 'food-form':{let it=foodById(ui.foodSelected),g=n(v('food-grams'));if(!it||g<=0){toast('Укажи продукт и массу');return}let fac=g/100,x={id:uid(),date:ui.date,meal:v('food-meal'),foodId:it.id,name:it.name,grams:g,kcal:round(it.kcal*fac,2),protein:round(it.protein*fac,2),fat:round(it.fat*fac,2),carbs:round(it.carbs*fac,2)};db.logs.meals.push(x);ui.foodMeal=x.meal;save();closeModal();render();toast(`${it.name} · +${fmt(x.kcal)} ккал`);break}
 case 'scan-form':{
   syncScanDraft();const z=scanState.values;
   const name=String(z.name||'').trim(),grams=Number(z.grams);
   let values=['kcal','protein','fat','carbs'].map(k=>Number(z[k]));
   if(!name||!Number.isFinite(grams)||grams<=0||grams>10000||values.some(x=>!Number.isFinite(x)||x<0)){toast('Проверь название, массу и все поля КБЖУ');return}
   if(values[0]>1000||values.slice(1).some(x=>x>100)||values[1]+values[2]+values[3]>110){toast('Цифры на 100 г выглядят ошибочными — перепроверь этикетку');return}
   let src={id:uid(),name,category:z.category,kcal:values[0],protein:values[1],fat:values[2],carbs:values[3]};
   if(scanState.saveCatalog){db.customFoods.push(src)}
   let fac=grams/100,entry={id:uid(),date:ui.date,meal:z.meal,foodId:scanState.saveCatalog?src.id:null,name,grams,kcal:round(src.kcal*fac,2),protein:round(src.protein*fac,2),fat:round(src.fat*fac,2),carbs:round(src.carbs*fac,2)};
   db.logs.meals.push(entry);ui.foodMeal=z.meal;save();resetScanState();closeModal();render();toast(name+' · '+fmt(entry.kcal)+' ккал добавлено');break
 }
 case 'custom-food-form':{let item={id:uid(),name:v('cf-name').trim(),category:v('cf-category'),kcal:n(v('cf-kcal')),protein:n(v('cf-protein')),fat:n(v('cf-fat')),carbs:n(v('cf-carbs'))};if(!item.name||[item.kcal,item.protein,item.fat,item.carbs].some(x=>!Number.isFinite(x)||x<0)){toast('Проверь название и БЖУ продукта');return}db.customFoods.push(item);save();ui.foodSelected=item.id;if(ui.foodReturnToSettings){ui.foodReturnToSettings=false;ui.settingsTab='catalog';openModal('settings')}else openModal('food-portion');toast('Продукт добавлен');break}
 case 'custom-ex-form':{let name=v('ce-name').trim();if(!name)return;let item={id:uid(),name,group:v('ce-group'),equipment:v('ce-equipment'),tip:v('ce-tip')};db.customExercises.push(item);save();if(ui.exPickType==='builder'){ui.builder?.sessions[ui.pickSessionIndex]?.exercises.push(makeTemplate(item.name))}else if(ui.exPickType==='workout'&&ui.draft){ui.draft.exercises.push({exerciseId:item.id,name:item.name,sets:[{kg:'',reps:'',done:false}]});persistDraft()}if(ui.exPickType==='catalog'){ui.settingsTab='catalog';openModal('settings')}else{closeModal();render()}toast('Упражнение добавлено');break}
 case 'cardio-form':{let duration=n(v('ca-duration')),dist=n(v('ca-distance'));if(duration<=0||dist<0){toast('Укажи корректные время и расстояние');return}let date=v('ca-date');db.logs.cardio.push({id:uid(),date,type:v('ca-type'),duration,distance:dist,steps:n(v('ca-steps')),hr:v('ca-hr')?n(v('ca-hr')):null,notes:''});ui.date=date;save();closeModal();render();toast('Активность сохранена');break}
 case 'sleep-form':{let bed=v('sl-bed'),wake=v('sl-wake'),date=v('sl-date');let [bh,bm]=bed.split(':').map(Number),[wh,wm]=wake.split(':').map(Number);let minutes=((wh*60+wm)-(bh*60+bm)+1440)%1440;if(minutes===0){toast('Проверь время начала и конца сна');return}if(minutes>960&&!confirm('Получается больше 16 часов сна. Сохранить?'))return;db.logs.sleep=db.logs.sleep.filter(x=>x.date!==date);db.logs.sleep.push({id:uid(),date,bed,wake,hours:round(minutes/60,2),quality:n(v('sl-quality')),notes:''});ui.date=date;save();closeModal();render();toast('Сон сохранён');break}
 case 'well-form':{let date=v('we-date');db.logs.wellness=db.logs.wellness.filter(x=>x.date!==date);db.logs.wellness.push({id:uid(),date,mood:n(v('we-mood')),energy:n(v('we-energy')),stress:n(v('we-stress')),soreness:n(v('we-soreness')),notes:v('we-notes')});ui.date=date;save();closeModal();render();toast('Самочувствие сохранено');break}
 case 'measure-form':{let date=v('me-date'),previous=db.logs.measures.find(y=>y.date===date)||{},x={id:previous.id||uid(),date},entered=false;for(let k of ['weight','waist','chest','hips','arm','thigh','neck']){let str=v('me-'+k);x[k]=str===''?(previous[k]??''):round(n(str),1);if(str!=='')entered=true}if(!entered){toast('Укажи хотя бы один замер');return}db.logs.measures=db.logs.measures.filter(y=>y.date!==date);db.logs.measures.push(x);if(x.weight!==''&&date>=String(latest('measures','weight')?.date||''))db.profile.weight=x.weight;ui.date=date;save();closeModal();render();toast('Замеры сохранены');break}
 case 'water-form':{let ml=n(v('wa-ml'));if(ml<1)return;let date=v('wa-date');db.logs.water.push({id:uid(),date,ml});ui.date=date;save();closeModal();render();toast('Вода добавлена');break}
 case 'generator-form':{let plan=preset(n(v('gen-frequency'),3),v('gen-goal'));db.plans.push(plan);db.activePlanId=plan.id;db.profile.frequency=plan.frequency;save();closeModal();ui.page='train';render();toast('План создан, теперь выбери тренировку');break}
 case 'settings-profile':{let props={name:v('pf-name').trim(),age:n(v('pf-age')),height:n(v('pf-height')),weight:n(v('pf-weight')),sex:v('pf-sex'),goal:v('pf-goal'),experience:v('pf-exp'),activity:v('pf-activity'),frequency:n(v('pf-frequency'))};Object.assign(db.profile,props);save();closeModal();render();toast('Профиль обновлён');break}
 case 'settings-targets':{Object.assign(db.profile,{calories:n(v('tar-cal')),protein:n(v('tar-protein')),fat:n(v('tar-fat')),carbs:n(v('tar-carbs')),water:n(v('tar-water'))});save();closeModal();render();let total=db.profile.protein*4+db.profile.fat*9+db.profile.carbs*4;toast(Math.abs(total-db.profile.calories)>100?`Цели сохранены. Сумма БЖУ ≈ ${fmt(total)} ккал, калорийная цель — ${fmt(db.profile.calories)}.`:'Цели сохранены');break}
 }
}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`forma-lab-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('Резервная копия готова')}
function importData(file){if(!file)return;if(file.size>8*1024*1024){toast('Файл слишком большой');return}let reader=new FileReader();reader.onload=()=>{try{let o=JSON.parse(reader.result);if(!o||!o.profile||!o.logs||!Array.isArray(o.logs.workouts)||!Array.isArray(o.logs.meals))throw Error('Неизвестный формат');if(o.logs.workouts.some(w=>!w||!Array.isArray(w.exercises)||w.exercises.some(e=>!e||!Array.isArray(e.sets))))throw Error('Повреждены записи тренировок');if(o.plans!=null&&(!Array.isArray(o.plans)||o.plans.some(p=>!p||!Array.isArray(p.sessions)||p.sessions.some(session=>!session||!Array.isArray(session.exercises)))))throw Error('Повреждены данные планов');if(!confirm('Импорт заменит текущие данные. Продолжить?'))return;if(o.version===1){let p=o.profile||{},base=initial();base.setupComplete=true;base.profile={...base.profile,name:p.name||'',age:p.age||'',height:p.height||'',weight:p.startingWeight||'',startDate:p.startDate||today(),goal:p.goal||'recomp',frequency:p.workoutsPerWeek||3,calories:p.kcal||0,protein:p.protein||0,fat:p.fat||0,carbs:p.carbs||0,water:p.water||2500};base.logs={...base.logs,...o.logs};base.plans=o.plans||[];base.activePlanId=o.activePlanId;db=base;}else if(o.version===2){db=o}else throw Error('Версия резервной копии не поддерживается');normalize();db.setupComplete=true;save();ui.draft=null;ui.builder=null;closeModal();render();toast('Данные импортированы')}catch(e){toast('Ошибка импорта: '+e.message)}};reader.onerror=()=>toast('Ошибка чтения');reader.readAsText(file)}
// Event delegation: no listeners on individual dynamic cards.
document.addEventListener('click',act);
document.addEventListener('input',inputs);
document.addEventListener('submit',formSubmit);
document.addEventListener('change',e=>{if(['scan-photo','scan-photo-camera'].includes(e.target.id))handleScanPhoto(e.target.files?.[0]);if(e.target.id==='scan-catalog')scanState.saveCatalog=e.target.checked});
$('#modal-root').addEventListener('click',e=>{if(e.target.id==='modal-back')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal)closeModal()});
$('#import-json').addEventListener('change',e=>{importData(e.target.files[0]);e.target.value=''});
try{let d=JSON.parse(localStorage.getItem('formlab.draft.v2'));if(d?.exercises?.length&&db.setupComplete){ui.draft=d;ui.draftOpen=false;ui.page='train'}}catch(e){}
render();if(!storageOK)setTimeout(()=>toast('Браузер ограничивает localStorage — данные могут не сохраниться'),500);
})();

</script></body></html>
